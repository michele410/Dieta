<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Macro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f5; --card:#ffffff; --text:#15181c; --muted:#6b7280;
  --orange:#fc4c02; --teal:#00a99d; --blue:#0072ce; --amber:#ffb400;
  --border:#e3e5e9; --shadow:0 1px 2px rgba(15,20,25,.05), 0 6px 16px -10px rgba(15,20,25,.15);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1113;--card:#1b1e22;--text:#f2f3f5;--muted:#8b929c;--orange:#ff6a2b;--teal:#20c4b6;--blue:#3d9bff;--amber:#ffc94d;--border:#2b2f34;--shadow:0 1px 2px rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{--bg:#0f1113;--card:#1b1e22;--text:#f2f3f5;--muted:#8b929c;--orange:#ff6a2b;--teal:#20c4b6;--blue:#3d9bff;--amber:#ffc94d;--border:#2b2f34;--shadow:0 1px 2px rgba(0,0,0,.4);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;}
.wrap{max-width:660px;margin:0 auto;padding:22px 16px 60px;}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;margin:0;}
.today{font-size:.72rem;color:var(--muted);margin:2px 0 18px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.eyebrow{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin:0 0 10px;}
.ringrow{display:flex;align-items:center;gap:20px;}
.ringbig{position:relative;flex:0 0 auto;}
.ringbig .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ringbig .num b{font-family:'Barlow Condensed',sans-serif;font-size:2.1rem;font-weight:700;line-height:1;color:var(--orange);}
.ringbig .num span{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.kcalinfo{flex:1;font-size:.84rem;color:var(--muted);}
.kcalinfo b{color:var(--text);}
.macrorow{display:flex;justify-content:space-around;gap:8px;margin-top:16px;}
.mring{position:relative;text-align:center;}
.mring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.mring .num b{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:700;line-height:1;}
.mring .cap{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:6px;}
.mring.p .num b{color:var(--teal);}
.mring.c .num b{color:var(--blue);}
.mring.f .num b{color:var(--amber);}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.addform select,.addform input{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.86rem;font-family:inherit;}
.addform select.food{flex:1 1 150px;}
.addform input.grams{width:72px;}
.addform select.meal{flex:0 0 105px;}
.addform button{background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:9px 18px;font-size:.78rem;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.custom{display:none;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.custom.show{display:flex;}
.custom input{padding:8px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:.82rem;width:86px;}
.custom input.cname{width:150px;}
.linkbtn{background:none;border:none;color:var(--blue);font-size:.75rem;cursor:pointer;font-weight:600;padding:2px 0;text-transform:uppercase;letter-spacing:.04em;}
.loglist{margin-top:12px;}
.logrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;gap:6px;}
.logrow:last-child{border-bottom:none;}
.logrow .meta{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;}
.logrow button{background:none;border:none;color:var(--muted);font-size:1.15rem;cursor:pointer;padding:0 4px;}
.empty{color:var(--muted);font-size:.85rem;}
.advice ul{margin:0;padding-left:16px;font-size:.86rem;}
.advice li{margin-bottom:6px;}
.allok{color:var(--teal);font-weight:700;font-size:.9rem;margin:0;text-transform:uppercase;letter-spacing:.03em;}
.status{font-size:.7rem;color:var(--muted);margin-top:8px;min-height:14px;text-transform:uppercase;letter-spacing:.05em;}
table.hist{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px;}
table.hist th{color:var(--muted);text-transform:uppercase;font-size:.65rem;letter-spacing:.05em;font-weight:700;}
table.hist th,table.hist td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--border);}
table.hist th:first-child,table.hist td:first-child{text-align:left;}
.chart{display:flex;gap:6px;margin-top:6px;}
.chartcol{display:flex;flex-direction:column;flex:1;align-items:center;min-width:0;}
.barwrap{height:76px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid var(--border);}
.chartcol .bar{width:100%;max-width:22px;background:var(--orange);border-radius:3px 3px 0 0;min-height:2px;}
.chartcol .lbl{font-size:.62rem;color:var(--muted);margin-top:6px;letter-spacing:.03em;}
[hidden]{display:none!important;}
.mgbtn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 14px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;margin-bottom:14px;width:100%;}
.addform select.unitsel{flex:0 0 86px;}
.hint{font-size:.78rem;color:var(--muted);margin:0 0 10px;}
.mgform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.mgform label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;display:flex;flex-direction:column;gap:3px;}
.mgform input{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;font-family:inherit;width:100%;}
.mgform .full{grid-column:1 / -1;}
.mgact{display:flex;gap:8px;margin-bottom:12px;}
.btn{background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:10px 16px;font-size:.76rem;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--border);}
.btn.danger{background:none;color:var(--orange);border:1px solid var(--orange);}
#mgSearch{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.88rem;margin-bottom:6px;font-family:inherit;}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.86rem;}
.mrow small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px;}
.mrow button{background:none;border:1px solid var(--border);color:var(--blue);border-radius:7px;padding:6px 10px;font-size:.7rem;font-weight:700;text-transform:uppercase;cursor:pointer;flex:0 0 auto;}
.logrow .lname{flex:1;min-width:0;}
.logrow .lname .meta{display:block;margin-top:2px;}
.qty{display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);}
.qty input{width:64px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:.88rem;text-align:right;font-family:inherit;}
.sugbtn{background:none;border:1px solid var(--blue);color:var(--blue);border-radius:16px;padding:3px 10px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;}
.sugbtn:active{opacity:.6;}
.tgform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.tgform label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;display:flex;flex-direction:column;gap:3px;}
.tgform input{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;font-family:inherit;width:100%;}
.histcard{display:none;}
.histcard.show{display:block;}
.chartcol .mini{display:flex;gap:2px;margin-top:6px;height:20px;align-items:flex-end;width:100%;max-width:22px;}
.chartcol .mini div{flex:1;border-radius:2px 2px 0 0;}
.hrow{padding:10px 0;border-bottom:1px solid var(--border);}
.hrow:last-child{border-bottom:none;}
.hrow .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;margin-bottom:6px;}
.hrow .hd b{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;}
.hbars{display:flex;gap:10px;}
.hbar{flex:1;}
.hbar .lbl{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;margin-bottom:3px;}
.hbar .track{height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.hbar .track>div{height:100%;}
</style>
</head>
<body>
<div class="wrap">
<p class="brand">Tracker Macro</p>
<div class="today" id="todayLabel"></div>
<button class="mgbtn" id="mgToggle">Gestisci alimenti</button>
<button class="mgbtn" id="tgToggle">Modifica obiettivi</button>
<div class="card" id="targetPanel" hidden>
  <p class="eyebrow">Obiettivi giornalieri</p>
  <div id="tgForm"></div>
</div>
<div class="card" id="manager" hidden>
  <p class="eyebrow">Gestisci alimenti</p>
  <p class="hint">Valori per 100 g. Se imposti anche l'unità (es. banana = 120 g) potrai inserirlo a pezzi.</p>
  <div id="mgForm"></div>
  <input id="mgSearch" type="search" placeholder="Cerca alimento…">
  <div id="mgList"></div>
</div>

<div class="card" id="kcalcard"></div>
<div class="card" id="macrocard"></div>

<div class="card">
<p class="eyebrow">Aggiungi alimento</p>
<div class="addform">
  <select class="food" id="foodSel"></select>
  <input class="grams" id="gramsInp" type="number" inputmode="decimal" min="0" step="any" placeholder="quantità">
  <select class="unitsel" id="unitSel"></select>
  <select class="meal" id="mealSel">
    <option>Colazione</option><option>Pranzo</option><option>Cena</option>
  </select>
  <button id="addBtn">Aggiungi</button>
</div>
<div class="loglist" id="loglist"></div>
</div>

<div class="card advice" id="advice"></div>



<div class="status" id="status"></div>
<button class="mgbtn" id="histToggle">Riepilogo giorni</button>
<div class="card histcard" id="histPanel">
<p class="eyebrow">Storico giorni</p>
<div id="histChart"></div>
<div id="histTable"></div>
</div>
</div>

<script>
const BASE_FOODS = [
  {id:'pollo',label:'Petto di pollo',kcal:165,p:31,c:0,f:3.6},
  {id:'tonno',label:'Tonno in scatola',kcal:116,p:26,c:0,f:1},
  {id:'sgombro',label:'Sgombro in scatola',kcal:190,p:20,c:0,f:12},
  {id:'lenticchie',label:'Lenticchie in scatola',kcal:100,p:8,c:17,f:0.5},
  {id:'ceci',label:'Ceci in scatola',kcal:120,p:7,c:20,f:2},
  {id:'banana',label:'Banana',kcal:89,p:1.1,c:23,f:0.3},
  {id:'riso',label:'Riso (cotto)',kcal:130,p:2.7,c:28,f:0.3},
  {id:'pasta',label:'Pasta (cotta)',kcal:158,p:5.8,c:31,f:0.9},
  {id:'patate',label:'Patate (cotte)',kcal:87,p:2,c:20,f:0.1},
  {id:'pomodori',label:'Pomodori',kcal:18,p:0.9,c:3.9,f:0.2},
  {id:'carote',label:'Carote',kcal:41,p:0.9,c:10,f:0.2},
  {id:'spinaci',label:'Spinaci (surgelati, cotti)',kcal:23,p:3,c:2,f:0.3},
  {id:'uova',label:'Uova intere',kcal:155,p:13,c:1.1,f:11},
  {id:'albume',label:'Albume',kcal:52,p:11,c:0.7,f:0.2},
  {id:'olio',label:'Olio EVO',kcal:884,p:0,c:0,f:100},
  {id:'lattevg',label:'Latte vegetale',kcal:40,p:1,c:3,f:2.5},
  {id:'yogurt',label:'Yogurt greco 0%',kcal:59,p:10,c:3.6,f:0.4},
  {id:'yogurtlidl',label:'Yogurt High Protein Lidl',kcal:58,p:10,c:4.5,f:0},
  {id:'cioccolato',label:'Cioccolato fondente 70%',kcal:598,p:7.8,c:45,f:42},
  {id:'mandorle',label:'Mandorle/frutta secca',kcal:579,p:21,c:22,f:50},
  {id:'pane',label:'Pane di semola',kcal:275,p:9.5,c:55,f:1.5},
  {id:'bresaola',label:'Bresaola',kcal:151,p:32,c:0.5,f:2.6},
  {id:'mozzlight',label:'Mozzarella light',kcal:200,p:22,c:3,f:11},
  {id:'gallette',label:'Gallette',kcal:387,p:8,c:81,f:2.8},
  {id:'avena',label:'Fiocchi d\u2019avena',kcal:389,p:17,c:66,f:7},
  {id:'whey',label:'Proteine idrolizzate',kcal:380,p:90,c:3,f:3}
];

const UNITS = {banana:['banana',120], uova:['uovo',55], albume:['albume',33], yogurtlidl:['vasetto',200], mozzlight:['mozzarella',125]};
BASE_FOODS.forEach(f=>{ if(UNITS[f.id]){ f.unit=UNITS[f.id][0]; f.unitG=UNITS[f.id][1]; } });
const DEFAULT_TARGET = { kcal:2700, p:125, c:360, f:85, tdee:2320 };
const NEVER_SUGGEST = ['gallette'];
const ITALIAN_DATE_OPTS = {weekday:'long', year:'numeric', month:'long', day:'numeric'};

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

let STATE;
try{ STATE = JSON.parse(localStorage.getItem('tracker-macro-state')); }catch(e){ STATE = null; }
if(!STATE || typeof STATE!=='object') STATE = {};
if(!STATE.days) STATE.days = {};
if(!Array.isArray(STATE.foods)){ STATE.foods = BASE_FOODS.map(f=>Object.assign({},f)).concat(STATE.custom||[]); delete STATE.custom; }
if(!STATE.target) STATE.target = Object.assign({}, DEFAULT_TARGET);
else STATE.target = Object.assign({}, DEFAULT_TARGET, STATE.target);
const TODAY = todayKey();
if(!STATE.days[TODAY]) STATE.days[TODAY] = {log:[]};

function allFoods(){ return STATE.foods; }
function foodById(id){ return allFoods().find(f=>f.id===id); }

function dayTotals(dayLog){
  let kcal=0,p=0,c=0,f=0;
  dayLog.forEach(e=>{
    const fo = foodById(e.food);
    if(!fo) return;
    const r = e.grams/100;
    kcal += fo.kcal*r; p += fo.p*r; c += fo.c*r; f += fo.f*r;
  });
  return {kcal:Math.round(kcal), p:Math.round(p), c:Math.round(c), f:Math.round(f)};
}

function ringSvg(pct, color, size, stroke){
  const r = (size-stroke)/2, cx=size/2, cy=size/2;
  const circ = 2*Math.PI*r;
  const off = circ*(1-Math.min(1,pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>
  </svg>`;
}

function renderTgForm(){
  const t = STATE.target;
  document.getElementById('tgForm').innerHTML = `
    <div class="tgform">
      <label>Obiettivo calorie (kcal)<input id="tfKcal" type="number" inputmode="decimal" value="${t.kcal}"></label>
      <label>Mantenimento (kcal)<input id="tfTdee" type="number" inputmode="decimal" value="${t.tdee}"></label>
      <label>Proteine (g)<input id="tfP" type="number" inputmode="decimal" value="${t.p}"></label>
      <label>Carboidrati (g)<input id="tfC" type="number" inputmode="decimal" value="${t.c}"></label>
      <label>Grassi (g)<input id="tfF" type="number" inputmode="decimal" value="${t.f}"></label>
    </div>
    <div class="mgact">
      <button class="btn" id="tfSave">Salva obiettivi</button>
      <button class="btn ghost" id="tfReset">Ripristina default</button>
    </div>`;
  document.getElementById('tfSave').addEventListener('click', ()=>{
    const g = id=>parseFloat(document.getElementById(id).value);
    STATE.target = {
      kcal: g('tfKcal')||STATE.target.kcal,
      tdee: g('tfTdee')||STATE.target.tdee,
      p: g('tfP')||STATE.target.p,
      c: g('tfC')||STATE.target.c,
      f: g('tfF')||STATE.target.f
    };
    renderAll(); save();
  });
  document.getElementById('tfReset').addEventListener('click', ()=>{
    STATE.target = Object.assign({}, DEFAULT_TARGET);
    renderTgForm(); renderAll(); save();
  });
}
document.getElementById('tgToggle').addEventListener('click', ()=>{
  const p = document.getElementById('targetPanel');
  p.hidden = !p.hidden;
  document.getElementById('tgToggle').textContent = p.hidden ? 'Modifica obiettivi' : 'Chiudi obiettivi';
});

function renderFoodSelect(){
  const sel = document.getElementById('foodSel');
  const prev = sel.value;
  sel.innerHTML = allFoods().map(f=>`<option value="${f.id}">${f.label}</option>`).join('');
  if(prev && foodById(prev)) sel.value = prev;
}

function renderUnitSel(){
  const fo = foodById(document.getElementById('foodSel').value);
  const sel = document.getElementById('unitSel');
  sel.innerHTML = '<option value="g">g</option>' + (fo && fo.unitG ? `<option value="u">${fo.unit}</option>` : '');
  sel.value = (fo && fo.unitG) ? 'u' : 'g';
}

function renderToday(){
  const d = new Date();
  document.getElementById('todayLabel').textContent = d.toLocaleDateString('it-IT', ITALIAN_DATE_OPTS);
}

function renderKcalCard(t){
  const pct = t.kcal/STATE.target.kcal;
  const surplusMsg = t.kcal >= STATE.target.tdee
    ? `In surplus di <b>${t.kcal-TDEE} kcal</b> sul mantenimento (${STATE.target.tdee})`
    : `Mancano <b>${STATE.target.tdee-t.kcal} kcal</b> al mantenimento (${STATE.target.tdee})`;
  document.getElementById('kcalcard').innerHTML = `
    <p class="eyebrow">Calorie di oggi</p>
    <div class="ringrow">
      <div class="ringbig">${ringSvg(pct,'var(--orange)',120,12)}
        <div class="num"><b>${t.kcal}</b><span>/ ${STATE.target.kcal} kcal</span></div>
      </div>
      <div class="kcalinfo">${surplusMsg}</div>
    </div>`;
}

function mRing(cls,label,val,target,color){
  const pct = val/target;
  return `<div class="mring ${cls}">${ringSvg(pct,color,76,9)}
    <div class="num"><b>${val}</b></div>
    <div class="cap">${label} · ${target}g</div></div>`;
}

function renderMacroCard(t){
  document.getElementById('macrocard').innerHTML = `
    <p class="eyebrow">Macronutrienti</p>
    <div class="macrorow">
      ${mRing('p','Prot',t.p,STATE.target.p,'var(--teal)')}
      ${mRing('c','Carb',t.c,STATE.target.c,'var(--blue)')}
      ${mRing('f','Gras',t.f,STATE.target.f,'var(--amber)')}
    </div>`;
}

function renderLog(){
  const box = document.getElementById('loglist');
  const log = STATE.days[TODAY].log;
  if(log.length===0){ box.innerHTML = '<p class="empty">Nessun alimento registrato oggi.</p>'; return; }
  box.innerHTML = log.map((e,i)=>{
    const fo = foodById(e.food);
    const kcal = fo? Math.round(fo.kcal*e.grams/100) : 0;
    const isU = e.units!=null && fo && fo.unitG;
    const val = isU ? e.units : e.grams;
    const suf = isU ? fo.unit : 'g';
    return `<div class="logrow">
      <div class="lname">${fo?fo.label:'(alimento rimosso)'}<span class="meta">${e.meal} · ${kcal} kcal${isU?' · '+e.grams+' g':''}</span></div>
      <div class="qty"><input class="qtyInp" type="number" inputmode="decimal" min="0" step="any" value="${val}" data-i="${i}"><span>${suf}</span></div>
      <button data-i="${i}" class="delBtn">×</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.qtyInp').forEach(inp=>inp.addEventListener('change',()=>{
    const e = log[parseInt(inp.dataset.i,10)];
    const fo = foodById(e.food);
    const v = parseFloat(inp.value)||0;
    if(v<=0){ renderAll(); return; }
    if(e.units!=null && fo && fo.unitG){ e.units = v; e.grams = Math.round(v*fo.unitG); } else { e.grams = v; }
    renderAll(); save();
  }));
  box.querySelectorAll('.delBtn').forEach(b=>b.addEventListener('click',()=>{
    STATE.days[TODAY].log.splice(parseInt(b.dataset.i,10),1);
    renderAll(); save();
  }));
}

const SUG_IDX = {p:0,c:0,f:0};
const MACRO_KCAL = {p:4,c:4,f:9};
function candidatesFor(m){
  return allFoods().filter(f=>!NEVER_SUGGEST.includes(f.id) && f[m]>0 && f.kcal>0 && (f[m]*MACRO_KCAL[m]/f.kcal)>=0.4)
    .sort((a,b)=>b[m]-a[m]);
}
function amountText(fo, grams){
  if(fo.unitG && grams>=fo.unitG/2){
    return `${Math.round(grams/fo.unitG*10)/10} ${fo.unit} (~${grams} g)`;
  }
  return `${grams} g`;
}
function sugLine(m, label, miss){
  const list = candidatesFor(m);
  if(!list.length) return `${label}: mancano <b>${miss} g</b>.`;
  const fo = list[SUG_IDX[m] % list.length];
  const g = Math.max(5, Math.round(miss/fo[m]*100/5)*5);
  return `${label}: mancano <b>${miss} g</b> — prova <button class="sugbtn" data-m="${m}">${amountText(fo,g)} di ${fo.label} \u21bb</button>`;
}

function renderAdvice(t){
  const box = document.getElementById('advice');
  const missP = Math.max(0, STATE.target.p-t.p);
  const missC = Math.max(0, STATE.target.c-t.c);
  const missF = Math.max(0, STATE.target.f-t.f);
  const missKcal = Math.max(0, STATE.target.kcal-t.kcal);
  if(missP<=0 && missC<=0 && missF<=0){
    box.innerHTML = `<p class="eyebrow">Consigli</p><p class="allok">Obiettivi di oggi raggiunti</p>`;
    return;
  }
  const lines = [];
  if(missP>0) lines.push(sugLine('p','Proteine',missP));
  if(missC>0) lines.push(sugLine('c','Carboidrati',missC));
  if(missF>0) lines.push(sugLine('f','Grassi',missF));
  box.innerHTML = `<p class="eyebrow">Cosa manca e cosa aggiungere</p><ul>${lines.map(s=>`<li>${s}</li>`).join('')}</ul>
    <p style="font-size:.78rem;color:var(--muted);margin:8px 0 0;">Tocca un alimento consigliato per vederne un altro. Calorie ancora da coprire: <b style="color:var(--text)">${missKcal} kcal</b></p>`;
  box.querySelectorAll('.sugbtn').forEach(b=>b.addEventListener('click',()=>{
    SUG_IDX[b.dataset.m]++;
    renderAdvice(dayTotals(STATE.days[TODAY].log));
  }));
}

function kcalColor(t){
  const pct = t.kcal / STATE.target.kcal;
  if(pct < 0.85) return 'var(--amber)';
  if(pct > 1.15) return 'var(--orange)';
  return 'var(--teal)';
}

function renderHistory(){
  const keys = Object.keys(STATE.days).sort();
  const chartBox = document.getElementById('histChart');
  const tableBox = document.getElementById('histTable');
  if(!document.getElementById('histPanel').classList.contains('show')) return;
  if(keys.length===0){
    chartBox.innerHTML = '';
    tableBox.innerHTML = '<p class="empty">Ancora nessun giorno registrato.</p>';
    return;
  }
  const last = keys.slice(-10);
  const maxKcal = Math.max(STATE.target.kcal, ...last.map(k=>dayTotals(STATE.days[k].log).kcal));
  chartBox.innerHTML = `<div class="chart">` + last.map(k=>{
    const t = dayTotals(STATE.days[k].log);
    const h = Math.max(2, Math.round(t.kcal/maxKcal*76));
    const dd = k.slice(8,10)+'/'+k.slice(5,7);
    const pP = Math.min(100, Math.round(t.p/STATE.target.p*100));
    const pC = Math.min(100, Math.round(t.c/STATE.target.c*100));
    const pF = Math.min(100, Math.round(t.f/STATE.target.f*100));
    return `<div class="chartcol">
      <div class="barwrap"><div class="bar" style="height:${h}px;background:${kcalColor(t)}" title="${t.kcal} kcal"></div></div>
      <div class="mini">
        <div style="height:${pP}%;background:var(--teal)" title="Prot ${t.p}g"></div>
        <div style="height:${pC}%;background:var(--blue)" title="Carb ${t.c}g"></div>
        <div style="height:${pF}%;background:var(--amber)" title="Gras ${t.f}g"></div>
      </div>
      <div class="lbl">${dd}</div></div>`;
  }).join('') + `</div>`;
  const rows = last.slice().reverse().map(k=>{
    const t = dayTotals(STATE.days[k].log);
    const dd = new Date(k+'T00:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
    const pP = Math.min(100, Math.round(t.p/STATE.target.p*100));
    const pC = Math.min(100, Math.round(t.c/STATE.target.c*100));
    const pF = Math.min(100, Math.round(t.f/STATE.target.f*100));
    return `<div class="hrow">
      <div class="hd"><span>${dd}</span><b style="color:${kcalColor(t)}">${t.kcal} kcal</b></div>
      <div class="hbars">
        <div class="hbar"><div class="lbl"><span>Prot</span><span>${t.p}g</span></div><div class="track"><div style="width:${pP}%;background:var(--teal)"></div></div></div>
        <div class="hbar"><div class="lbl"><span>Carb</span><span>${t.c}g</span></div><div class="track"><div style="width:${pC}%;background:var(--blue)"></div></div></div>
        <div class="hbar"><div class="lbl"><span>Gras</span><span>${t.f}g</span></div><div class="track"><div style="width:${pF}%;background:var(--amber)"></div></div></div>
      </div>
    </div>`;
  }).join('');
  tableBox.innerHTML = rows;
}

function renderAll(){
  const t = dayTotals(STATE.days[TODAY].log);
  renderToday();
  renderKcalCard(t);
  renderMacroCard(t);
  renderLog();
  renderAdvice(t);
  renderHistory();
}

document.getElementById('addBtn').addEventListener('click', ()=>{
  try{
    const food = document.getElementById('foodSel').value;
    const qty = parseFloat((document.getElementById('gramsInp').value||'').replace(',','.'))||0;
    const meal = document.getElementById('mealSel').value;
    const mode = document.getElementById('unitSel').value;
    const fo = foodById(food);
    if(!fo){ alert('Alimento non trovato: riselezionalo dall\'elenco e riprova.'); return; }
    if(qty<=0){ alert('Inserisci una quantit\u00e0 maggiore di zero.'); return; }
    if(meal==='Cena' && food==='gallette'){
      alert('Hai detto di non voler mai cenare con le gallette: scegli un altro alimento per la cena.');
      return;
    }
    const entry = {food, meal, grams:qty};
    if(mode==='u' && fo.unitG){ entry.units = qty; entry.grams = Math.round(qty*fo.unitG); }
    else if(mode==='u' && !fo.unitG){ entry.grams = qty; }
    STATE.days[TODAY].log.push(entry);
    document.getElementById('gramsInp').value='';
    renderAll(); save();
  }catch(err){
    alert('Errore nell\'aggiunta: ' + err.message);
  }
});
document.getElementById('foodSel').addEventListener('change', renderUnitSel);

// ---------- gestione alimenti ----------
let editingId = null;
function renderMgForm(){
  const fo = editingId ? foodById(editingId) : null;
  const v = (k)=> fo && fo[k]!=null ? fo[k] : '';
  document.getElementById('mgForm').innerHTML = `
    <div class="mgform">
      <label class="full">Nome<input id="mfName" value="${fo?fo.label.replace(/"/g,'&quot;'):''}" placeholder="es. Parmigiano Reggiano"></label>
      <label>Kcal / 100 g<input id="mfKcal" type="number" inputmode="decimal" value="${v('kcal')}"></label>
      <label>Proteine / 100 g<input id="mfP" type="number" inputmode="decimal" value="${v('p')}"></label>
      <label>Carboidrati / 100 g<input id="mfC" type="number" inputmode="decimal" value="${v('c')}"></label>
      <label>Grassi / 100 g<input id="mfF" type="number" inputmode="decimal" value="${v('f')}"></label>
      <label>Unità (facoltativa)<input id="mfUnit" value="${v('unit')}" placeholder="es. banana"></label>
      <label>Grammi per unità<input id="mfUnitG" type="number" inputmode="decimal" value="${v('unitG')}" placeholder="es. 120"></label>
    </div>
    <div class="mgact">
      <button class="btn" id="mfSave">${fo?'Salva modifiche':'Aggiungi alimento'}</button>
      ${fo?'<button class="btn ghost" id="mfCancel">Annulla</button><button class="btn danger" id="mfDel">Elimina</button>':''}
    </div>`;
  document.getElementById('mfSave').addEventListener('click', saveFood);
  if(fo){
    document.getElementById('mfCancel').addEventListener('click', ()=>{ editingId=null; renderMgForm(); });
    document.getElementById('mfDel').addEventListener('click', ()=>{
      if(!confirm('Eliminare questo alimento dalla lista?')) return;
      STATE.foods = STATE.foods.filter(x=>x.id!==editingId);
      editingId=null; renderMgForm(); renderMgList(); renderFoodSelect(); renderUnitSel(); renderAll(); save();
    });
  }
}
function saveFood(){
  const g = id=>document.getElementById(id).value;
  const name = g('mfName').trim();
  if(!name) return;
  const p = parseFloat(g('mfP'))||0, c = parseFloat(g('mfC'))||0, f = parseFloat(g('mfF'))||0;
  let kcal = parseFloat(g('mfKcal'));
  if(isNaN(kcal)) kcal = Math.round(p*4 + c*4 + f*9);
  const un = g('mfUnit').trim(), ug = parseFloat(g('mfUnitG'))||0;
  const hasU = un && ug>0;
  let newId = null;
  if(editingId){
    const fo = foodById(editingId);
    Object.assign(fo, {label:name,kcal,p,c,f});
    if(hasU){ fo.unit=un; fo.unitG=ug; } else { delete fo.unit; delete fo.unitG; }
  } else {
    const fo = {id:'f_'+Date.now(), label:name, kcal, p, c, f};
    if(hasU){ fo.unit=un; fo.unitG=ug; }
    STATE.foods.push(fo); newId = fo.id;
  }
  editingId = null;
  renderMgForm(); renderMgList(); renderFoodSelect();
  if(newId) document.getElementById('foodSel').value = newId;
  renderUnitSel(); renderAll(); save();
}
function renderMgList(){
  const q = document.getElementById('mgSearch').value.trim().toLowerCase();
  const list = allFoods().filter(f=>!q || f.label.toLowerCase().includes(q));
  document.getElementById('mgList').innerHTML = list.map(f=>`
    <div class="mrow"><span>${f.label}<small>${f.kcal} kcal · P ${f.p} · C ${f.c} · G ${f.f}${f.unitG?' · 1 '+f.unit+' = '+f.unitG+' g':''}</small></span>
    <button data-id="${f.id}" class="editBtn">Modifica</button></div>`).join('') || '<p class="empty">Nessun alimento trovato.</p>';
  document.querySelectorAll('#mgList .editBtn').forEach(b=>b.addEventListener('click',()=>{
    editingId = b.dataset.id; renderMgForm();
    document.getElementById('mgForm').scrollIntoView({behavior:'smooth',block:'start'});
  }));
}
document.getElementById('mgSearch').addEventListener('input', renderMgList);
document.getElementById('histToggle').addEventListener('click', ()=>{
  const p = document.getElementById('histPanel');
  p.classList.toggle('show');
  document.getElementById('histToggle').textContent = p.classList.contains('show') ? 'Chiudi riepilogo' : 'Riepilogo giorni';
  if(p.classList.contains('show')){ renderHistory(); p.scrollIntoView({behavior:'smooth',block:'start'}); }
});
document.getElementById('mgToggle').addEventListener('click', ()=>{
  const m = document.getElementById('manager');
  m.hidden = !m.hidden;
  document.getElementById('mgToggle').textContent = m.hidden ? 'Gestisci alimenti' : 'Chiudi gestione alimenti';
});

function save(){
  try{ localStorage.setItem('tracker-macro-state', JSON.stringify(STATE)); }catch(e){}
}

renderFoodSelect();
renderUnitSel();
renderTgForm();
renderMgForm();
renderMgList();
renderAll();

</script>
